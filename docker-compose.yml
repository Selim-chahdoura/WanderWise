services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: wanderwise-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pswd
      POSTGRES_DB: wanderwise
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d wanderwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: wanderwise-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/wanderwise
      DATABASE_URL: postgresql://user:pswd@postgres:5432/wanderwise
    volumes:
      - ./airflow:/opt/airflow
      - ./src:/opt/airflow/wanderwise/src
      - ./data:/opt/airflow/wanderwise/data
      - ./config:/opt/airflow/wanderwise/config
    working_dir: /opt/airflow/wanderwise
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderwise-app
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://user:pswd@postgres:5432/wanderwise
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: wanderwise-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgvector_data:
  grafana_data: